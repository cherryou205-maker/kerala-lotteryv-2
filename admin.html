<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>

body{
background:#111;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.box{
background:#222;
padding:30px;
border-radius:10px;
width:300px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
font-size:18px;
border:none;
border-radius:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:15px;
font-size:18px;
background:green;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<div id="loginBox">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="login()">
Login
</button>

</div>

<div id="panel" style="display:none;">

<h2>Update Number</h2>

<input
type="text"
id="number"
placeholder="Enter Number">

<button onclick="saveNumber()">
Save Number
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyB9HOvSm1BCOeg4uZGGXekneJtl6bPvzHw",

authDomain: "jackpot-95a64.firebaseapp.com",

databaseURL: "https://jackpot-95a64-default-rtdb.firebaseio.com",

projectId: "jackpot-95a64",

storageBucket: "jackpot-95a64.firebasestorage.app",

messagingSenderId: "319234479146",

appId: "1:319234479146:web:1366505c43418c7e0b5f53"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

window.login = function(){

const pass =
document.getElementById("password").value;

if(pass === "12345"){

document.getElementById("loginBox").style.display = "none";

document.getElementById("panel").style.display = "block";

}else{

alert("Wrong Password");

}

}

window.saveNumber = function(){

const number =
document.getElementById("number").value;

set(ref(db, "lottery"), {
number: number
});

alert("Updated Successfully");

}

</script>

</body>
</html>
